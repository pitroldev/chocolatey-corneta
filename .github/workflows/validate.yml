name: Validate Chocolatey package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-upgrade-uninstall:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install, reinstall, and remove in the disposable runner
        shell: powershell
        run: ./scripts/validate.ps1
