name: Update Corneta

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit and submit the verified package (false only validates)
        type: boolean
        default: false
  pull_request:
    paths: [".github/workflows/update.yml", "scripts/**"]

permissions:
  contents: read

concurrency:
  group: corneta-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: package
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pitroldev/corneta
          ref: b5db392100f5894217e100d764be11ce91516d62
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - name: Verify the upstream release and update package metadata
        id: update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node automation/scripts/distribution.mjs prepare .artifacts/release
          if ($LASTEXITCODE) { throw 'Release verification failed.' }
          node automation/scripts/distribution.mjs chocolatey .artifacts/release package
          if ($LASTEXITCODE) { throw 'Package update failed.' }
      - name: Check whether this version is already submitted
        id: feed
        working-directory: package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw corneta.nuspec)).package.metadata.version
          $url = "https://community.chocolatey.org/api/v2/Packages(Id='corneta',Version='$version')"
          try {
            $response = Invoke-WebRequest -Uri $url -TimeoutSec 30
            [xml]$metadata = $response.Content
            if ($metadata.entry.properties.Version -ne $version) { throw 'Unexpected feed response.' }
            'submitted=true' >> $env:GITHUB_OUTPUT
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            'submitted=false' >> $env:GITHUB_OUTPUT
          }
      - name: Validate installation and removal on the disposable runner
        if: steps.update.outputs.changed == 'true' || steps.feed.outputs.submitted != 'true' || github.event_name == 'pull_request'
        working-directory: package
        shell: powershell
        run: ./scripts/validate.ps1
      - name: Commit verified package metadata
        if: >-
          steps.update.outputs.changed == 'true' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        shell: pwsh
        run: |
          node automation/scripts/distribution.mjs assert-current .artifacts/release
          if ($LASTEXITCODE) { throw 'The release changed after validation.' }
          node automation/scripts/commit-distribution.mjs chocolatey package $env:VERSION
          if ($LASTEXITCODE) { throw 'Package commit failed.' }
      - name: Submit the package for moderation
        if: >-
          steps.feed.outputs.submitted != 'true' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish)
        working-directory: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          if (-not $env:CHOCOLATEY_API_KEY) { throw 'Configure CHOCOLATEY_API_KEY to activate package submission.' }
          node ../automation/scripts/distribution.mjs assert-current ../.artifacts/release
          if ($LASTEXITCODE) { throw 'The release changed after validation.' }
          choco push "corneta.$env:VERSION.nupkg" --source=https://push.chocolatey.org/ --api-key=$env:CHOCOLATEY_API_KEY --timeout=180 --no-color
          if ($LASTEXITCODE) { throw 'Chocolatey submission failed. The next run checks the feed before retrying.' }
          'Package submitted; Chocolatey moderation and public availability are separate.' >> $env:GITHUB_STEP_SUMMARY
      - name: Report feed status
        env:
          SUBMITTED: ${{ steps.feed.outputs.submitted }}
        shell: pwsh
        run: |
          "Version already submitted before this run: $env:SUBMITTED" >> $env:GITHUB_STEP_SUMMARY
